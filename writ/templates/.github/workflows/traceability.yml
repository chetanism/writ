name: traceability

# The exact complement of `gate.yml`'s `paths-ignore`.
#
# `gate.yml` skips docs-only pull requests, which is right for lint and tests and wrong for this:
# adding a requirement to the BRD changes the coverage ledger and touches no code. So this runs on
# **precisely the pull requests the gate skips** — Markdown and the `writ/` tree — plus `scripts/`,
# because the gate runs `ledger.py check` but not the tool's own suite. A test file is code, so the
# gate already runs the check for it; listing test globs here as well bills every slice twice.
#
# Pull requests only, for the reason `gate.yml` gives.

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'writ/**'
      - '**/*.md'
      - 'scripts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the branch check below diffs against the base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: the tool's own suite
        run: python3 scripts/test_ledger.py
      - name: ledger and queue are current, and every process check passes
        run: python3 scripts/ledger.py check

      # One requirement, one branch — writ/spec/requirements/README.md for the detail files and
      # writ/qa/README.md for the scenarios. The branch is the identifier lowercased and nothing
      # else, which is what lets a second sitting find the first rather than start a second file.
      # Renames and deletions are exempt: moving a file is not detailing a requirement, and a bulk
      # move should not have to pick a requirement to be. `index.md` is exempt with `README.md`:
      # an area's register lives at `<AREA>/index.md`, beside the detail files that elaborate it,
      # and it is changed by `/change-request apply` on a `cr/` branch. Reading one as a detail
      # file demands a branch called `req/index`, which no skill ever creates.
      #
      # Both tracks are checked by one loop rather than by two near-identical steps: the rule is
      # the same rule, and two copies of it would drift the first time one is corrected. Keep the
      # two directories in step with `requirements.dir` and `scenarios.dir` in ledger.config.json.
      #
      # `github.head_ref` is attacker-controlled text, so it reaches the script as an environment
      # variable and never as an interpolation inside it.
      - name: a requirement's file arrives on its own branch
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -- "writ/spec/requirements:req:detail file" "writ/qa/scenarios:qa:scenarios file"
          for track in "$@"; do
            dir=${track%%:*}; rest=${track#*:}; prefix=${rest%%:*}; what=${rest#*:}
            changed=$(git diff --diff-filter=AM --name-only "origin/$BASE_REF...HEAD" \
              -- "$dir" | grep -E '\.md$' | grep -vE '(README|index)\.md$' || true)
            if [ -z "$changed" ]; then continue; fi
            ids=$(echo "$changed" | sed 's|.*/||; s|\.md$||' | sort -u)
            want=$(echo "$ids" | tr '[:upper:]' '[:lower:]' | sed "s|^|$prefix/|")
            if [ "$(echo "$ids" | wc -l)" -ne 1 ] || [ "$HEAD_REF" != "$want" ]; then
              echo "::error::a requirement $what belongs on its own branch, named for the requirement"
              echo "  branch:   $HEAD_REF"
              echo "  expected: $(echo "$want" | paste -sd' ' -)"
              echo "  changed:"
              echo "$changed" | sed 's|^|    |'
              exit 1
            fi
          done

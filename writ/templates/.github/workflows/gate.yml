name: gate

# Docs-only changes skip this workflow: a typo fix should not start a database.
#
# TRAP, and it is not obvious. `paths-ignore` skips only when *every* changed file matches, and a
# skipped workflow reports **no status at all**. If this ever becomes a required status check, a
# docs-only pull request will block forever waiting for a run that will never happen. The fix at
# that point is a second, always-running job that reports success — not removing this filter.
#
# The complement to this filter is `traceability.yml`, whose trigger is an allow-list of exactly
# the inputs the coverage ledger reads. Adding a requirement to the BRD changes the ledger and
# touches no code, so that check must run on precisely the pull requests this one skips.

#
# **Pull requests only.** A `push: [dev]` trigger re-checks a tree the pull request already passed —
# with squash merges it is the same tree — and GitHub bills each job to the whole minute. One project
# measured this at more than half of its CI minutes. If `dev` needs a check after merge, run the
# gate locally there.

on:
  pull_request:
    branches: [dev, main]
    paths-ignore: ['writ/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pin the runtime from a version file, so local and CI cannot disagree about it.
      # <Replace with the setup action for this stack; keep the version-file form.>
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Cache whatever the stack's build tool can reuse between runs — the package store, and a
      # task cache such as `.turbo` where there is one. <Replace with this stack's cache step, or
      # delete it.> A cached task that reads a repository-wide file (the ledger's outputs, a
      # generated schema) must list it as an input or opt out of caching, or the gate goes green on
      # a stale result.
      - uses: actions/cache@v4
        with:
          path: <cache directories>
          key: ${{ runner.os }}-build-${{ hashFiles('<lockfile>') }}
          restore-keys: ${{ runner.os }}-build-

      - name: install
        run: <install, with a frozen lockfile>

      # Steps stay separate rather than one aggregate command, so a red cross names the thing that
      # broke. Cheap checks first.
      - name: format
        run: <format check>

      - name: lint
        run: <lint>

      - name: types
        run: <typecheck>

      - name: traceability
        run: python3 scripts/ledger.py check

      - name: contract
        run: <contract check, or delete this step>

      - name: unit tests
        run: <unit tests>

      - name: stack up
        run: <start the local stack, or delete this step and the two below>

      - name: integration tests
        run: <integration tests>

      - name: stack down
        if: always()
        run: <stop the local stack>

  # The `work_order` perimeter lives here rather than in `traceability.yml` because it is about
  # **code**: this workflow runs on every pull request that changes code, and the traceability one
  # runs on exactly the ones that do not.
  perimeter:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the check diffs against the base
      # The `work_order` perimeter — the one rule this repository's own tool cannot check, because
      # it is about a diff and `ledger.py` only ever sees one commit's worth of tree.
      #
      # **Read the perimeter from `ledger.config.json` rather than repeating it here.** Two copies
      # of the set of adopted paths is two answers to *is this directory in force yet*, found on
      # the day somebody widens one of them. `enforce.work_order` falls back to `enforce.default`,
      # exactly as the tool resolves it.
      #
      # The failure this prevents is not a developer forgetting a work order. It is the one where
      # four people who never agreed to any of this start having their pull requests rejected for
      # a rule that arrived in somebody else's commit. Inside the perimeter, a change belongs to a
      # claimed slice; outside it, this step says nothing at all. An empty perimeter — the default
      # an adoption writes on day one — means it never speaks.
      #
      # `github.head_ref` is attacker-controlled text, so it reaches the script as an environment
      # variable and never as an interpolation inside it.
      - name: a change inside the perimeter belongs to a claimed slice
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          CHANGED="$(git diff --diff-filter=ACMR --name-only "origin/$BASE_REF...HEAD")" \
          ORDERS="$(git diff --name-only "origin/$BASE_REF...HEAD" -- writ/process/work-orders)" \
          python3 - <<'EOF'
          import json, os, re, sys

          def rx(pattern):
              """The same `**`-aware glob-to-regex as `ledger.py`'s `glob_regex`."""
              out, i = [], 0
              while i < len(pattern):
                  if pattern.startswith("**/", i): out.append("(?:.*/)?"); i += 3
                  elif pattern.startswith("**", i): out.append(".*"); i += 2
                  elif pattern[i] == "*": out.append("[^/]*"); i += 1
                  elif pattern[i] == "?": out.append("[^/]"); i += 1
                  else: out.append(re.escape(pattern[i])); i += 1
              return re.compile("".join(out) + r"\Z")

          enforce = json.load(open("scripts/ledger.config.json")).get("enforce") or {}
          patterns = enforce.get("work_order")
          if patterns is None:
              patterns = enforce.get("default") or []
          if not patterns:
              print("no work_order perimeter configured — nothing to enforce")
              raise SystemExit(0)

          # The writ tree is outside the perimeter whatever the patterns say. Documents are how
          # this process is corrected, and a correction that needed its own slice would never be
          # made.
          exempt = re.compile(r"^(writ/|scripts/|CLAUDE\.md$|\.github/)")
          rxs = [rx(p) for p in patterns]
          inside = [
              f for f in os.environ["CHANGED"].split("\n")
              if f and not exempt.match(f) and any(r.match(f) for r in rxs)
          ]
          if not inside:
              raise SystemExit(0)

          branch = os.environ.get("HEAD_REF", "")
          listing = "\n".join("    " + f for f in inside)
          if not branch.startswith("slice/"):
              print("::error::these paths are inside the work_order perimeter and this is not a slice branch")
              print("  branch: " + branch)
              print(listing)
              print("  open it with /slice-open, or narrow enforce.work_order in scripts/ledger.config.json")
              raise SystemExit(1)
          if not [f for f in os.environ["ORDERS"].split("\n") if f.endswith(".md")]:
              print("::error::a slice branch changing perimeter paths carries no work order")
              print(listing)
              raise SystemExit(1)
          EOF

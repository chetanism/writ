name: kit

# The kit's own gate. It had none, which is how four blocking defects reached `main` at once in
# documents the kit itself ships — a registry pattern its process document did not obey, a config
# pointing a track at the directory that holds its own registers, a drift check that crashed on the
# shipped registry, and a workflow step that refused the branch its own skill creates.
#
# Everything below is an instance of something the kit argues for and did not do to itself:
# generated artefacts are verified rather than trusted, and a claim with nothing behind it is not
# a claim. `templates/scripts/test_ledger.py` tests the tool; `writ/tests/test_templates.py`
# tests the documents.

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # The floor the tool states, not the newest available: `ledger.py` claims Python 3.9+ and a
      # claim nothing runs at is a claim nobody has checked.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: the tool's own suite
        run: python3 writ/templates/scripts/test_ledger.py

      - name: the survey tool's own suite
        run: python3 writ/templates/scripts/test_survey.py

      - name: the velocity tool's own suite
        run: python3 writ/templates/scripts/test_velocity.py

      - name: the falsification runner's own suite
        run: python3 writ/templates/scripts/test_falsify.py

      - name: the claims tool's own suite
        run: python3 writ/templates/scripts/test_claims.py

      - name: the templates, bootstrapped and checked
        run: python3 writ/tests/test_templates.py

      # The worked example in docs/example/ is the only place a reader can see a filled-in tree
      # without running an interview, which makes it the one document most worth keeping true. It
      # is generated: this rebuilds it and fails on any difference.
      - name: the worked example is what the tool actually prints
        run: python3 writ/tests/build_example.py --check

      # Three bootstrap skills that must stay in step: they emit the same tree, name the same
      # fifteen project skills, and a reference added for one is usually needed by another. A
      # skill whose front matter does not parse is one Claude Code silently does not load — and for
      # a project skill that failure is copied into every repository the kit bootstraps.
      - name: every skill has parseable front matter
        run: |
          for skill in writ/skills/*/SKILL.md writ/templates/.claude/skills/*/SKILL.md .claude/skills/*/SKILL.md; do
            python3 - "$skill" <<'EOF'
          import sys
          text = open(sys.argv[1]).read()
          assert text.startswith("---\n"), sys.argv[1] + ": no front matter"
          head = text.split("---\n")[1]
          keys = dict(
              line.split(":", 1) for line in head.strip().split("\n") if ":" in line
          )
          for want in ("name", "description"):
              assert want in keys, sys.argv[1] + ": front matter has no " + want
          print("ok  " + sys.argv[1] + " (" + keys["name"].strip() + ")")
          EOF
          done

      # A reference the skills name and the kit does not ship is a load that fails mid-interview,
      # after the user has answered forty questions.
      - name: every reference a skill loads exists
        run: |
          missing=0
          for ref in $(grep -ohE 'references/[0-9a-z/-]+\.md' writ/skills/*/SKILL.md | sort -u); do
            if [ ! -f "writ/$ref" ]; then echo "::error::missing writ/$ref"; missing=1; fi
          done
          [ "$missing" = 0 ] && echo "ok  every reference resolves"

      # Documentation that names a skill the kit does not ship, or a skill with no page, is the
      # same defect as a reference that does not resolve — a claim with nothing behind it. The
      # link check is here because the whole documentation set is cross-linked and a rename
      # silently breaks every page that pointed at the old name.
      - name: every skill has a page, and every documentation link resolves
        run: |
          python3 - <<'EOF'
          import glob, os, re, sys

          pages = {os.path.basename(p)[:-3] for p in glob.glob("writ/docs/skills/*.md")} - {"README"}
          skills = {
              os.path.basename(os.path.dirname(s))
              for s in glob.glob("writ/skills/*/SKILL.md")
              + glob.glob("writ/templates/.claude/skills/*/SKILL.md")
          }

          bad = 0
          for name in sorted(skills - pages):
              print("::error::skill " + name + " has no page at writ/docs/skills/" + name + ".md")
              bad = 1
          for name in sorted(pages - skills):
              print("::error::writ/docs/skills/" + name + ".md documents a skill that does not exist")
              bad = 1

          LINK = re.compile(r"\]\(([^)]+)\)")
          docs = ["README.md", "writ/README.md"] + glob.glob("writ/docs/**/*.md", recursive=True)
          for doc in sorted(docs):
              for target in LINK.findall(open(doc).read()):
                  if target.startswith(("http://", "https://", "#", "mailto:")):
                      continue
                  path = target.split("#", 1)[0]
                  if not path:
                      continue
                  if not os.path.exists(os.path.normpath(os.path.join(os.path.dirname(doc), path))):
                      print("::error::" + doc + ": link to " + target + " resolves to nothing")
                      bad = 1

          sys.exit(bad)
          EOF
          echo "ok  every skill has a page and every documentation link resolves"

      # A plugin whose manifest does not parse is one that fails at install time, in somebody
      # else's repository, with an error about this one.
      - name: the plugin manifests parse
        run: |
          for manifest in .claude-plugin/marketplace.json writ/.claude-plugin/plugin.json \
                          writ/templates/scripts/ledger.config.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$manifest"
            echo "ok  $manifest"
          done

      # The manual-test harness is shell and ships unexecuted — there is no product to point it at
      # until a project has one, so a syntax error in it would surface at the first walk rather
      # than here.
      - name: the shipped shell parses
        run: |
          for script in writ/templates/.claude/skills/manual-test/*.sh; do
            bash -n "$script"
            echo "ok  $script"
          done

      # `.DS_Store` and `__pycache__` are ignored, and an ignore rule only helps a file nobody
      # forced in. A template tree with editor litter in it is copied, litter and all, into every
      # project the kit bootstraps.
      - name: no litter is tracked
        run: |
          litter=$(git ls-files | grep -E '(^|/)(\.DS_Store|__pycache__/|.*\.pyc)$' || true)
          if [ -n "$litter" ]; then
            echo "::error::tracked files that belong to nobody:"
            echo "$litter" | sed 's|^|    |'
            exit 1
          fi
          echo "ok  nothing tracked that should not be"

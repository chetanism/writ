name: gate

# Docs-only changes skip this workflow: a typo fix should not start a database.
#
# TRAP, and it is not obvious. `paths-ignore` skips only when *every* changed file matches, and a
# skipped workflow reports **no status at all**. If this ever becomes a required status check, a
# docs-only pull request will block forever waiting for a run that will never happen. The fix at
# that point is a second, always-running job that reports success — not removing this filter.
#
# The complement to this filter is `traceability.yml`, whose trigger is an allow-list of exactly
# the inputs the coverage ledger reads. Adding a requirement to the BRD changes the ledger and
# touches no code, so that check must run on precisely the pull requests this one skips.

on:
  pull_request:
    branches: [dev, main]
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [dev]
    paths-ignore: ['docs/**', '**/*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pin the runtime from a version file, so local and CI cannot disagree about it.
      # <Replace with the setup action for this stack; keep the version-file form.>
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install
        run: <install, with a frozen lockfile>

      # Steps stay separate rather than one aggregate command, so a red cross names the thing that
      # broke. Cheap checks first.
      - name: format
        run: <format check>

      - name: lint
        run: <lint>

      - name: types
        run: <typecheck>

      - name: traceability
        run: python3 scripts/ledger.py check

      - name: contract
        run: <contract check, or delete this step>

      - name: unit tests
        run: <unit tests>

      - name: stack up
        run: <start the local stack, or delete this step and the two below>

      - name: integration tests
        run: <integration tests>

      - name: stack down
        if: always()
        run: <stop the local stack>
